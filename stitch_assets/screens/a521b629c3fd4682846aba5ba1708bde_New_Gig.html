<!-- Main Content -->

<!-- Header Section -->
<section class="flex flex-col gap-xs">
<h1 class="font-display text-display text-primary">New Gig</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Define the parameters of your next project to build a precise gear manifest.</p>
</section>
<!-- Form Section -->

<!-- Basic Details -->

<div class="flex flex-col gap-xs">

<input class="w-full bg-surface-container-lowest border border-surface-variant p-sm font-body-md text-body-md text-primary rounded-DEFAULT transition-colors placeholder:text-outline" id="gig-name" placeholder="e.g., Summer Editorial Campaign" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="gig-date">Date</label>
<input class="w-full bg-surface-container-lowest border border-surface-variant p-sm font-body-md text-body-md text-primary rounded-DEFAULT transition-colors text-on-surface-variant" id="gig-date" type="date"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="gig-location">Location</label>
<input class="w-full bg-surface-container-lowest border border-surface-variant p-sm font-body-md text-body-md text-primary rounded-DEFAULT transition-colors placeholder:text-outline" id="gig-location" placeholder="e.g., Studio 42" type="text"/>
</div>
</div>
</section>
<!-- Divider -->
<div class="h-[1px] w-full bg-surface-variant"></div>

<section class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant">Gig Type</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-md">
<!-- Selected Type -->

<span class="material-symbols-outlined text-[10px] text-on-primary font-bold">check</span>
</div>
<span class="material-symbols-outlined text-primary text-[24px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
<span class="font-headline-md text-headline-md text-primary">Photography</span>
</button>

<span class="font-headline-md text-headline-md text-on-surface-variant group-hover:text-primary transition-colors">Video</span>
</button>

<span class="material-symbols-outlined text-on-surface-variant text-[24px] group-hover:text-primary transition-colors">mic</span>
<span class="font-headline-md text-headline-md text-on-surface-variant group-hover:text-primary transition-colors">Audio</span>
</button>
<!-- Unselected Type -->
<button class="gig-type-btn flex flex-col items-start gap-sm p-md bg-surface-container-lowest border border-surface-variant rounded-DEFAULT text-left hover:border-outline transition-colors group" type="button">
<span class="material-symbols-outlined text-on-surface-variant text-[24px] group-hover:text-primary transition-colors">wifi_tethering</span>

<!-- Active State -->

<button class="size-btn flex-1 md:w-[120px] py-[10px] bg-surface-container-lowest border-l border-surface-variant text-on-surface-variant font-body-md text-body-md transition-colors hover:bg-surface-container-low" type="button">Large</button>
</div>

<span class="material-symbols-outlined text-[18px]">auto_awesome</span>
                    Let AI suggest what I need
                </button>
</section>
</form>
</main>
<script>
        // Minimal script to handle UI toggles for demonstration of active states
        document.addEventListener('DOMContentLoaded', () => {
            // Handle Gig Type cards
            const typeBtns = document.querySelectorAll('.gig-type-btn');
            typeBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Reset all
                    typeBtns.forEach(b => {
                        b.classList.remove('border-primary');
                        b.classList.add('border-surface-variant');
                        const check = b.querySelector('.absolute');
                        if(check) check.remove();
                        const icon = b.querySelector('.material-symbols-outlined');
                        const text = b.querySelector('.font-headline-md');
                        icon.classList.remove('text-primary');
                        icon.classList.add('text-on-surface-variant');
                        icon.style.fontVariationSettings = "normal";
                        text.classList.remove('text-primary');
                        text.classList.add('text-on-surface-variant');
                    });
                    
                    // Set active
                    btn.classList.remove('border-surface-variant');
                    btn.classList.add('border-primary');
                    
                    const icon = btn.querySelector('.material-symbols-outlined');
                    const text = btn.querySelector('.font-headline-md');
                    icon.classList.remove('text-on-surface-variant');
                    icon.classList.add('text-primary');
                    icon.style.fontVariationSettings = "'FILL' 1";
                    text.classList.remove('text-on-surface-variant');
                    text.classList.add('text-primary');

                    const checkmark = document.createElement('div');
                    checkmark.className = 'absolute top-sm right-sm w-[12px] h-[12px] rounded-full bg-primary flex items-center justify-center';
                    checkmark.innerHTML = '<span class="material-symbols-outlined text-[10px] text-on-primary font-bold">check</span>';
                    btn.appendChild(checkmark);
                });
            });

            // Handle Size pills
            const sizeBtns = document.querySelectorAll('.size-btn');
            sizeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    sizeBtns.forEach(b => {
                        b.classList.remove('bg-primary', 'text-on-primary');
                        b.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
                    });
                    btn.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
                    btn.classList.add('bg-primary', 'text-on-primary');
                });
            });
        });
    </script>
