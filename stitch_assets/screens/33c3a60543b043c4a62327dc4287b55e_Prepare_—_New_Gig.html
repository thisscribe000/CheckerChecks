<style>
        body {

        .ruled-border {

        .ruled-border-bottom {

            background: transparent;
            border: none;
            border-bottom: 1px solid #1a1a1a;

            padding: 8px 0;
            box-shadow: none !important;
        }
        .ink-input:focus {
            outline: none;
            border-bottom: 2px solid #1a1a1a;
        }
        
        .chip-option {
            border: 1px solid #1a1a1a;
            border-radius: 0;
            transition: all 0.1s ease;
        }

            background-color: #1a1a1a;
            color: #faf9f5;
        }

            border: 1px solid #1a1a1a;

<body class="font-body-md text-body-md min-h-screen flex flex-col">

<header class="bg-surface dark:bg-surface flex justify-between items-center w-full px-margin-edge h-14 border-b border-outline dark:border-outline-variant docked full-width top-0 z-40 relative">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container dark:hover:bg-primary-container transition-colors duration-75 ease-linear p-2 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">menu</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg tracking-tighter text-primary dark:text-primary-fixed">KITLIST</div>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container dark:hover:bg-primary-container transition-colors duration-75 ease-linear p-2 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">search</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex justify-center p-margin-edge md:p-8">
<div class="w-full max-w-2xl bg-surface-container-lowest ruled-border p-6 md:p-10 relative">
<!-- Page Title -->
<div class="mb-10 ruled-border-bottom pb-4">
<h1 class="font-display text-display uppercase tracking-tight text-primary">Prepare a Gig</h1>
<p class="font-label-mono text-label-mono text-on-surface-variant mt-2">NEW ASSIGNMENT DIRECTIVE</p>
</div>
<!-- Form Layout -->
<form class="space-y-8">
<!-- Basic Info Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
<div class="flex flex-col relative">
<label class="font-label-mono text-label-mono text-on-surface-variant mb-1">GIG NAME / IDENTIFIER</label>
<input class="ink-input font-body-md text-body-md text-primary w-full" placeholder="e.g. Summer Music Festival" type="text"/>
</div>
<div class="flex flex-col relative">
<label class="font-label-mono text-label-mono text-on-surface-variant mb-1">GIG TYPE</label>
<select class="ink-input font-body-md text-body-md text-primary w-full appearance-none rounded-none bg-transparent cursor-pointer">
<option disabled="" selected="" value="">Select category...</option>
<option value="corporate">Corporate Event</option>
<option value="music">Music/Concert</option>
<option value="studio">Studio Session</option>
<option value="field">Field Recording</option>
</select>
<span class="material-symbols-outlined absolute right-0 bottom-2 pointer-events-none" style="font-variation-settings: 'wght' 200;">arrow_drop_down</span>
</div>
<div class="flex flex-col relative">
<label class="font-label-mono text-label-mono text-on-surface-variant mb-1">DATE / DURATION</label>
<input class="ink-input font-body-md text-body-md text-primary w-full uppercase" type="date"/>
</div>
<div class="flex flex-col relative">
<label class="font-label-mono text-label-mono text-on-surface-variant mb-1">LOCATION / VENUE</label>
<input class="ink-input font-body-md text-body-md text-primary w-full" placeholder="Address or venue name" type="text"/>
<span class="material-symbols-outlined absolute right-0 bottom-2 text-on-surface-variant" style="font-variation-settings: 'wght' 200;">location_on</span>
</div>
</div>
<!-- Needs Selection -->
<div class="pt-6 ruled-border-top">
<label class="font-label-mono text-label-mono text-primary mb-4 block">WHAT ARE YOU BRINGING?</label>
<div class="flex flex-wrap gap-3">
<button class="chip-option px-4 py-2 font-label-mono text-label-mono uppercase hover:bg-surface-container-high" onclick="this.classList.toggle('selected')" type="button">Photo</button>
<button class="chip-option px-4 py-2 font-label-mono text-label-mono uppercase hover:bg-surface-container-high" onclick="this.classList.toggle('selected')" type="button">Video</button>
<button class="chip-option px-4 py-2 font-label-mono text-label-mono uppercase hover:bg-surface-container-high" onclick="this.classList.toggle('selected')" type="button">Audio</button>
<button class="chip-option px-4 py-2 font-label-mono text-label-mono uppercase hover:bg-surface-container-high" onclick="this.classList.toggle('selected')" type="button">Light</button>
<button class="chip-option px-4 py-2 font-label-mono text-label-mono uppercase hover:bg-surface-container-high" onclick="this.classList.toggle('selected')" type="button">Stream</button>
</div>
</div>
<!-- Notes Area -->
<div class="pt-6 ruled-border-top">
<label class="font-label-mono text-label-mono text-on-surface-variant mb-1 block">ADDITIONAL DIRECTIVES / NOTES</label>
<textarea class="ink-input font-body-md text-body-md text-primary w-full h-24 resize-none" placeholder="Special requirements, client requests, etc..."></textarea>
</div>
<!-- Action Area -->
<div class="pt-8 flex flex-col md:flex-row gap-4 justify-end items-center">
<button class="brutal-btn-secondary w-full md:w-auto px-6 py-3 font-label-mono text-label-mono uppercase flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]">smart_toy</span>
                        Ask AI
                    </button>
<button class="brutal-btn-primary w-full md:w-auto px-8 py-3 font-label-mono text-label-mono uppercase flex items-center justify-center gap-2" type="button">
                        Build My List
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>

<span class="font-label-mono text-label-mono uppercase text-[10px]">Settings</span>
</a>
</nav>

<div class="h-16 md:hidden w-full"></div>
