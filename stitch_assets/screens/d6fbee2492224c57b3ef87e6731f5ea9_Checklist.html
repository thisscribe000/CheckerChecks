<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>GIG CHECKLIST - Kitlist</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#000000",
                        "on-primary-container": "#858383",
                        "primary-fixed": "#e5e2e1",
                        "on-tertiary-container": "#868381",
                        "surface": "#f9f9f9",
                        "on-surface-variant": "#444748",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#dadada",
                        "tertiary-fixed-dim": "#cac6c3",
                        "outline-variant": "#c4c7c7",
                        "on-tertiary-fixed": "#1c1b1a",
                        "primary-container": "#1c1b1b",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e2e2e2",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-error": "#ffffff",
                        "tertiary": "#000000",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#1c1b1b",
                        "surface-bright": "#f9f9f9",
                        "background": "#f9f9f9",
                        "tertiary-fixed": "#e6e1df",
                        "on-primary-fixed-variant": "#474646",
                        "surface-tint": "#5f5e5e",
                        "surface-container": "#eeeeee",
                        "primary-fixed-dim": "#c8c6c5",
                        "secondary-fixed": "#e4e2e2",
                        "surface-variant": "#e2e2e2",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#e8e8e8",
                        "on-secondary-container": "#626262",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#464747",
                        "on-surface": "#1a1c1c",
                        "on-background": "#1a1c1c",
                        "inverse-surface": "#2f3131",
                        "on-tertiary-fixed-variant": "#484645",
                        "outline": "#747878",
                        "inverse-on-surface": "#f1f1f1",
                        "on-secondary-fixed": "#1b1c1c",
                        "secondary": "#5e5e5e",
                        "surface-container-low": "#f3f3f3",
                        "inverse-primary": "#c8c6c5",
                        "secondary-container": "#e1dfdf",
                        "tertiary-container": "#1c1b1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sm": "8px",
                        "xl": "40px",
                        "md": "16px",
                        "margin-desktop": "48px",
                        "xs": "4px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "display": ["Inter"],
                        "headline-md": ["Inter"],
                        "mono-sm": ["monospace"],
                        "headline-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "mono-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.06em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .custom-checkbox:checked {
            background-color: #121212 !important;
            border-color: #121212 !important;
        }
        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 1px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col pt-16">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 bg-surface dark:bg-surface-container-lowest border-b border-outline-variant dark:border-on-surface-variant">
<button aria-label="Menu" class="text-primary dark:text-on-surface hover:opacity-80 transition-opacity flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="font-headline-lg text-headline-lg font-bold tracking-tighter text-primary dark:text-on-surface">
            KITLIST
        </div>
<button aria-label="Profile" class="text-primary dark:text-on-surface hover:opacity-80 transition-opacity flex items-center justify-center w-8 h-8 rounded-full bg-surface-variant overflow-hidden">
<span class="material-symbols-outlined text-sm" data-icon="person">person</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-lg pb-[100px]">
<!-- Gig Header -->
<section class="mb-lg">
<div class="flex items-start justify-between mb-sm">
<div>
<h1 class="font-display text-display text-primary mb-xs">Wedding Shoot</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Saturday, Oct 12 · 2:00 PM</p>
</div>
<div class="flex flex-col items-end">
<span class="bg-surface-container-highest px-3 py-1 rounded-full font-label-caps text-label-caps text-on-surface">IN PREP</span>
</div>
</div>
<!-- Progress Summary -->
<div class="bg-surface-container-lowest border border-outline-variant p-md rounded flex items-center justify-between">
<div>
<span class="font-headline-md text-headline-md text-primary block">14 / 18 packed</span>
<span class="font-body-md text-body-md text-error flex items-center mt-xs">
<span class="material-symbols-outlined text-[16px] mr-1" data-icon="warning" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
                        4 items remaining
                    </span>
</div>
<div class="w-1/2 max-w-[200px]">
<div class="w-full bg-surface-variant rounded-full h-2 overflow-hidden">
<div class="bg-primary h-2 rounded-full" style="width: 77%"></div>
</div>
</div>
</div>
</section>
<!-- Checklist Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg">
<!-- Category: Camera -->
<div class="flex flex-col">
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-md border-b border-outline-variant pb-xs">CAMERA</h2>
<div class="flex flex-col gap-sm">
<!-- Item 1 (Checked) -->
<label class="flex items-center p-md bg-surface-container-lowest border border-outline-variant rounded cursor-pointer hover:bg-surface-container-low transition-colors">
<div class="relative w-5 h-5 mr-md">
<input checked="" class="custom-checkbox appearance-none w-5 h-5 border-2 border-outline rounded-[2px] bg-white cursor-pointer" type="checkbox">
</div>
<div class="flex-1 flex items-center">
<div class="w-10 h-10 bg-surface-variant rounded mr-md flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="photo_camera">photo_camera</span>
</div>
<div>
<span class="font-body-md text-body-md font-bold text-primary block">Sony A7S III</span>
<span class="font-mono-sm text-mono-sm text-on-surface-variant block">SN: 849201A</span>
</div>
</div>
</label>
<!-- Item 2 (Checked) -->
<label class="flex items-center p-md bg-surface-container-lowest border border-outline-variant rounded cursor-pointer hover:bg-surface-container-low transition-colors">
<div class="relative w-5 h-5 mr-md">
<input checked="" class="custom-checkbox appearance-none w-5 h-5 border-2 border-outline rounded-[2px] bg-white cursor-pointer" type="checkbox">
</div>
<div class="flex-1 flex items-center">
<div class="w-10 h-10 bg-surface-variant rounded mr-md flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="camera_lens">camera_lens</span>
</div>
<div>
<span class="font-body-md text-body-md font-bold text-primary block">35mm GM</span>
<span class="font-mono-sm text-mono-sm text-on-surface-variant block">f/1.4</span>
</div>
</div>
</label>
<!-- Item 3 (Unchecked/Missing) -->
<label class="flex items-center p-md bg-error-container border border-error rounded cursor-pointer hover:bg-[#ffd0cb] transition-colors relative">
<div class="absolute right-md top-1/2 -translate-y-1/2">
<span class="material-symbols-outlined text-error" data-icon="error" data-weight="fill" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<div class="relative w-5 h-5 mr-md">
<input class="custom-checkbox appearance-none w-5 h-5 border-2 border-error rounded-[2px] bg-white cursor-pointer" type="checkbox">
</div>
<div class="flex-1 flex items-center pr-lg">
<div class="w-10 h-10 bg-surface-container-lowest rounded mr-md flex items-center justify-center border border-error/30">
<span class="material-symbols-outlined text-error" data-icon="camera_lens">camera_lens</span>
</div>
<div>
<span class="font-body-md text-body-md font-bold text-error block">85mm GM</span>
<span class="font-mono-sm text-mono-sm text-error/80 block">⚠ Missing from kit</span>
</div>
</div>
</label>
</div>
</div>
<!-- Category: Audio -->
<div class="flex flex-col">
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-md border-b border-outline-variant pb-xs">AUDIO</h2>
<div class="flex flex-col gap-sm">
<!-- Item 1 (Checked) -->
<label class="flex items-center p-md bg-surface-container-lowest border border-outline-variant rounded cursor-pointer hover:bg-surface-container-low transition-colors">
<div class="relative w-5 h-5 mr-md">
<input checked="" class="custom-checkbox appearance-none w-5 h-5 border-2 border-outline rounded-[2px] bg-white cursor-pointer" type="checkbox">
</div>
<div class="flex-1 flex items-center">
<div class="w-10 h-10 bg-surface-variant rounded mr-md flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="mic">mic</span>
</div>
<div>
<span class="font-body-md text-body-md font-bold text-primary block">DJI Mic 2</span>
<span class="font-mono-sm text-mono-sm text-on-surface-variant block">2x Tx, 1x Rx</span>
</div>
</div>
</label>
<!-- Item 2 (Checked) -->
<label class="flex items-center p-md bg-surface-container-lowest border border-outline-variant rounded cursor-pointer hover:bg-surface-container-low transition-colors">
<div class="relative w-5 h-5 mr-md">
<input checked="" class="custom-checkbox appearance-none w-5 h-5 border-2 border-outline rounded-[2px] bg-white cursor-pointer" type="checkbox">
</div>
<div class="flex-1 flex items-center">
<div class="w-10 h-10 bg-surface-variant rounded mr-md flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="cable">cable</span>
</div>
<div>
<span class="font-body-md text-body-md font-bold text-primary block">XLR Cables</span>
<span class="font-mono-sm text-mono-sm text-on-surface-variant block">2x 10ft, 1x 25ft</span>
</div>
</div>
</label>
</div>
</div>
<!-- Category: Power -->
<div class="flex flex-col">
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-md border-b border-outline-variant pb-xs">POWER</h2>
<div class="flex flex-col gap-sm">
<!-- Item 1 (Checked) -->
<label class="flex items-center p-md bg-surface-container-lowest border border-outline-variant rounded cursor-pointer hover:bg-surface-container-low transition-colors">
<div class="relative w-5 h-5 mr-md">
<input checked="" class="custom-checkbox appearance-none w-5 h-5 border-2 border-outline rounded-[2px] bg-white cursor-pointer" type="checkbox">
</div>
<div class="flex-1 flex items-center">
<div class="w-10 h-10 bg-surface-variant rounded mr-md flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="battery_charging_full">battery_charging_full</span>
</div>
<div>
<span class="font-body-md text-body-md font-bold text-primary block">V-Mount Battery</span>
<span class="font-mono-sm text-mono-sm text-on-surface-variant block">98Wh</span>
</div>
</div>
</label>
<!-- Item 2 (Unchecked/Missing) -->
<label class="flex items-center p-md bg-error-container border border-error rounded cursor-pointer hover:bg-[#ffd0cb] transition-colors relative">
<div class="absolute right-md top-1/2 -translate-y-1/2">
<span class="material-symbols-outlined text-error" data-icon="error" data-weight="fill" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<div class="relative w-5 h-5 mr-md">
<input class="custom-checkbox appearance-none w-5 h-5 border-2 border-error rounded-[2px] bg-white cursor-pointer" type="checkbox">
</div>
<div class="flex-1 flex items-center pr-lg">
<div class="w-10 h-10 bg-surface-container-lowest rounded mr-md flex items-center justify-center border border-error/30">
<span class="material-symbols-outlined text-error" data-icon="battery_3_bar">battery_3_bar</span>
</div>
<div>
<span class="font-body-md text-body-md font-bold text-error block">NP-FZ100 (x4)</span>
<span class="font-mono-sm text-mono-sm text-error/80 block">⚠ Missing</span>
</div>
</div>
</label>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area (Contextual to this flow, overriding standard BottomNav) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant p-md z-40">
<div class="max-w-[1280px] mx-auto flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant hidden md:block">Please check off all items before proceeding.</span>
<button class="w-full md:w-auto bg-surface-dim text-on-surface-variant font-label-caps text-label-caps px-xl py-3 rounded cursor-not-allowed opacity-50 flex items-center justify-center" disabled="">
                I'm Ready
                <span class="material-symbols-outlined ml-2 text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>


</body></html>
