<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary selection:text-surface">

<label class="flex items-center h-[56px] border-b-rule-weight border-primary cursor-pointer group">
<div class="w-12 flex justify-center items-center">
<input checked="" class="peer sr-only" type="checkbox">
<div class="w-[18px] h-[18px] border-rule-weight border-primary peer-checked:bg-primary flex items-center justify-center transition-colors">
<svg class="w-3 h-3 text-surface check-svg" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>

<!-- Script for local interaction simulation (optional, just for standard checklist feel) -->
<script>
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const label = this.closest('label');
                const textSpan = label.querySelector('span.flex-grow');
                if (this.checked) {
                    textSpan.classList.add('opacity-40', 'line-through');
                } else {
                    textSpan.classList.remove('opacity-40', 'line-through');
                }
            });
        });
    </script>
