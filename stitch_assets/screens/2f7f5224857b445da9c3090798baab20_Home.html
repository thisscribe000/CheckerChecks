<!DOCTYPE html>

<style>
        body { background-color: theme('colors.background-warm'); color: theme('colors.on-background'); }

        .icon-fill { font-variation-settings: 'FILL' 1; }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="antialiased min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 font-body-md text-body-md">
<!-- Mobile Nav Shell - BottomNavBar (Only visible on mobile) -->
<nav class="fixed bottom-0 w-full z-50 border-t border-stroke-subtle dark:border-outline-variant flat no shadows md:hidden bg-surface-container-lowest dark:bg-surface-container-lowest">
<div class="flex justify-around items-center h-16 w-full bg-white dark:bg-surface">
<!-- Active Tab: Gigs -->
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-label-bold active:scale-95 transition-transform">
<span class="material-symbols-outlined icon-fill" data-icon="event_note" data-weight="fill">event_note</span>
<span class="font-label-caps text-label-caps mt-1">Gigs</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant font-label-bold hover:text-primary dark:hover:text-primary-fixed-dim active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="font-label-caps text-label-caps mt-1">Inventory</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant font-label-bold hover:text-primary dark:hover:text-primary-fixed-dim active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-caps text-label-caps mt-1">Settings</span>
</button>
</div>
</nav>
<!-- Desktop Nav Shell - Side Navigation (Hidden on mobile) -->
<aside class="hidden md:flex flex-col w-64 h-screen border-r border-stroke-subtle bg-surface-container-lowest sticky top-0">
<div class="p-container-margin flex items-center justify-between border-b border-stroke-subtle">
<span class="font-display text-headline-md tracking-tighter text-on-background">KITLIST</span>

</div>
<div class="flex-1 py-unit px-unit flex flex-col gap-2 mt-4">
<button class="flex items-center gap-3 px-4 py-3 rounded-lg bg-surface-container-low text-primary font-label-bold transition-colors duration-200">
<span class="material-symbols-outlined icon-fill" data-icon="event_note" data-weight="fill">event_note</span>
                Gigs
            </button>
<button class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-low hover:text-on-background font-label-bold transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
                Inventory
            </button>
<button class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-low hover:text-on-background font-label-bold transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
                Settings
            </button>
</div>
</aside>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col w-full max-w-[1440px] mx-auto">
<!-- TopAppBar (Mobile only, hidden on md) -->
<header class="w-full top-0 sticky border-b border-stroke-subtle dark:border-outline-variant flat no shadows bg-background dark:bg-background transition-colors duration-200 flex justify-between items-center px-container-margin py-unit h-16 md:hidden z-40">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<span class="font-display text-headline-md-mobile tracking-tighter text-on-background dark:text-on-background">KITLIST</span>
<img alt="User Avatar" class="w-8 h-8 rounded-full object-cover border border-stroke-subtle" data-alt="A small, professional user avatar portrait of a creative professional in a well-lit studio setting with a clean, light-mode background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuADVb545hAVq-7Ficz3bT1BH2IQDZjZUv5K1BTxD-FLOy2XA601T1d50T2d-MDOd8Z8ciBDFloxzGkAmrmz6137d_YJ9e8B1C-RX9DcVfEmw0cZubQg9QbjYP_H-KNHzcaFxyVZ6vl8AxXbU6zQE9JmSrNS6keNgjRr6cO09_yAkTsjoP1_bQ-zLcF1gI1nPI3KN5U2VlEmO7OMmdFAS4OlGW25T5RHoTJf313bGI09gxpdn7xRyrTcag"/>
</header>
<div class="p-container-margin md:p-[48px] flex-1">
<!-- Hero Heading -->
<section class="mb-section-gap pt-4">
<h1 class="font-display text-display md:text-[64px] md:leading-[72px] tracking-tighter text-on-background max-w-2xl">
                    Ready for your<br/>next gig?
                </h1>
</section>
<!-- Upcoming Gig Card -->
<section class="mb-section-gap">
<div class="bg-surface-container-lowest border border-stroke-subtle rounded-xl p-6 relative overflow-hidden group hover:border-outline-variant transition-colors">
<div class="flex justify-between items-start mb-6">
<div>
<span class="inline-block px-3 py-1 rounded-full border border-stroke-subtle font-label-caps text-label-caps text-on-surface-variant mb-3 uppercase tracking-wider bg-surface-container-low">Upcoming</span>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background mb-1">Wedding Shoot</h2>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
                                Tomorrow · 2:00 PM
                            </p>
</div>
<button class="w-10 h-10 rounded-full border border-stroke-subtle flex items-center justify-center hover:bg-surface-container-low transition-colors text-on-background">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<div class="mt-4">
<div class="flex justify-between items-end mb-2">
<span class="font-label-bold text-label-bold text-on-background">Pack Status</span>
<span class="font-body-md text-body-md text-on-surface-variant"><strong class="text-on-background">14</strong> / 18 packed</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 77%;"></div>
</div>
</div>
</div>
</section>
<!-- Recent Gigs Grid -->
<section>
<div class="flex justify-between items-baseline mb-6">
<h3 class="font-headline-md text-headline-md text-on-background">Your recent gigs</h3>
<button class="font-label-bold text-label-bold text-primary hover:underline">View all</button>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Recent Gig 1 -->
<div class="bg-surface-container-lowest border border-stroke-subtle rounded-xl p-5 hover:bg-surface-container-low transition-colors cursor-pointer flex justify-between items-center group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">mic</span>
</div>
<div>
<h4 class="font-label-bold text-label-bold text-on-background mb-1">Podcast Recording</h4>
<p class="font-body-md text-[14px] text-on-surface-variant">Oct 12 · Studio A</p>
</div>
</div>
<span class="material-symbols-outlined text-stroke-subtle group-hover:text-on-surface-variant transition-colors">chevron_right</span>
</div>
<!-- Recent Gig 2 -->
<div class="bg-surface-container-lowest border border-stroke-subtle rounded-xl p-5 hover:bg-surface-container-low transition-colors cursor-pointer flex justify-between items-center group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">corporate_fare</span>
</div>
<div>
<h4 class="font-label-bold text-label-bold text-on-background mb-1">Corporate Event</h4>
<p class="font-body-md text-[14px] text-on-surface-variant">Sep 28 · Downtown Center</p>
</div>
</div>
<span class="material-symbols-outlined text-stroke-subtle group-hover:text-on-surface-variant transition-colors">chevron_right</span>
</div>
</div>
</section>
</div>
</main>
<!-- Floating Action Button -->
<button class="fixed bottom-20 md:bottom-8 right-container-margin md:right-8 bg-primary-container text-on-primary-container hover:bg-primary-container/90 transition-all active:scale-95 shadow-none border border-primary px-6 py-4 rounded-xl flex items-center gap-2 z-50">
<span class="material-symbols-outlined font-bold">add</span>
<span class="font-label-bold text-label-bold uppercase tracking-wider">New Gig</span>
</button>
