<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gig Screen - Kitlist</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#783200",
                        "inverse-on-surface": "#f3f0ef",
                        "surface-container-highest": "#e5e2e1",
                        "surface-tint": "#0053db",
                        "on-error": "#ffffff",
                        "primary": "#004ac6",
                        "surface-variant": "#e5e2e1",
                        "tertiary-container": "#bc4800",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#434655",
                        "secondary-container": "#fd761a",
                        "surface-container-high": "#eae7e7",
                        "background": "#fcf9f8",
                        "primary-fixed-dim": "#b4c5ff",
                        "outline-variant": "#c3c6d7",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#00174b",
                        "secondary-fixed-dim": "#ffb690",
                        "outline": "#737686",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#5c2400",
                        "on-tertiary-fixed": "#360f00",
                        "inverse-surface": "#313030",
                        "background-warm": "#FAF9F6",
                        "surface-container-low": "#f6f3f2",
                        "stroke-subtle": "#E5E4E1",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-tertiary-container": "#ffede6",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "tertiary": "#943700",
                        "surface-container": "#f0eded",
                        "on-secondary": "#ffffff",
                        "secondary": "#9d4300",
                        "on-secondary-fixed": "#341100",
                        "surface": "#fcf9f8",
                        "on-primary": "#ffffff",
                        "primary-container": "#2563eb",
                        "on-primary-container": "#eeefff",
                        "secondary-fixed": "#ffdbca",
                        "surface-bright": "#fcf9f8",
                        "on-surface": "#1c1b1b",
                        "tertiary-fixed": "#ffdbcd",
                        "inverse-primary": "#b4c5ff",
                        "surface-dim": "#dcd9d9",
                        "primary-fixed": "#dbe1ff",
                        "on-background": "#1c1b1b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "unit": "4px",
                        "container-margin": "24px",
                        "section-gap": "48px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-bold": ["Inter"],
                        "body-md": ["Inter"],
                        "display": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.03em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.06em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400" }],
                        "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #FAF9F6; /* background-warm */
            color: #1c1b1b;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Custom radio input styling for cards */
        .option-card input:checked + div {
            border-color: #2563eb;
            background-color: #f6f3f2;
        }
        .option-card input:checked + div .icon-container {
            color: #2563eb;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background border-b border-stroke-subtle flex justify-between items-center px-container-margin py-unit transition-colors duration-200 z-40 hidden md:flex">
<div class="flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-low p-2 rounded cursor-pointer">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</div>
<div class="font-display text-headline-md tracking-tighter text-on-background">KITLIST</div>
<div class="flex items-center gap-4 text-primary cursor-pointer">
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-stroke-subtle">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="A professional headshot of a creative individual in a modern, well-lit studio environment, wearing minimalist clothing. Clean background, soft natural lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDceCGIaBfPK9qi-uz_Y0CWF4VfGlyl69u7aC7ASlpN3C-1jNbyr6Fn_hvOlkqkOauxEJrp-iqoB0Fj5Va7Mb40CZ9NW6ixd8xHM-LhdzdPBOXqABSLnivvaa5ypocvsGENfNjd3IOf55MxfN3g8JetElflPv__reVhmv70jo34h-S9nKYjqjj5YaMUg6pmw15uTzB1uHwBMkV4-5jJBEmqbNEJZMyBqgC-KglwlWascgmDgIQJ7VJBWg"/>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow w-full max-w-[1440px] mx-auto px-[20px] md:px-container-margin pb-32 md:pb-section-gap pt-section-gap">
<div class="max-w-3xl mx-auto">
<!-- Header -->
<div class="mb-section-gap text-center md:text-left">
<h1 class="font-display text-display text-on-background mb-4">Let’s get you ready.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Tell us about your next project to build the perfect gear list.</p>
</div>
<form class="space-y-section-gap">
<!-- Step 1 -->
<section>
<div class="flex items-center gap-3 mb-6 border-b border-stroke-subtle pb-4">
<div class="w-8 h-8 rounded-full bg-on-background text-on-primary flex items-center justify-center font-label-bold">1</div>
<h2 class="font-headline-md text-headline-md-mobile md:text-headline-md text-on-background">What are you doing?</h2>
</div>
<div class="grid grid-cols-2 md:grid-cols-3 gap-gutter">
<label class="option-card cursor-pointer">
<input class="sr-only" name="gig_type" type="radio" value="photography"/>
<div class="bg-surface-container-lowest border border-stroke-subtle rounded-xl p-6 h-full flex flex-col items-center justify-center gap-4 transition-all hover:bg-surface-container-low">
<div class="icon-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-4xl" data-icon="photo_camera" style="font-variation-settings: 'FILL' 0;">photo_camera</span>
</div>
<span class="font-label-bold text-label-bold text-on-background">Photography</span>
</div>
</label>
<label class="option-card cursor-pointer">
<input class="sr-only" name="gig_type" type="radio" value="video"/>
<div class="bg-surface-container-lowest border border-stroke-subtle rounded-xl p-6 h-full flex flex-col items-center justify-center gap-4 transition-all hover:bg-surface-container-low">
<div class="icon-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-4xl" data-icon="videocam" style="font-variation-settings: 'FILL' 0;">videocam</span>
</div>
<span class="font-label-bold text-label-bold text-on-background">Video</span>
</div>
</label>
<label class="option-card cursor-pointer">
<input class="sr-only" name="gig_type" type="radio" value="audio"/>
<div class="bg-surface-container-lowest border border-stroke-subtle rounded-xl p-6 h-full flex flex-col items-center justify-center gap-4 transition-all hover:bg-surface-container-low">
<div class="icon-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-4xl" data-icon="mic" style="font-variation-settings: 'FILL' 0;">mic</span>
</div>
<span class="font-label-bold text-label-bold text-on-background">Audio</span>
</div>
</label>
<label class="option-card cursor-pointer">
<input class="sr-only" name="gig_type" type="radio" value="livestream"/>
<div class="bg-surface-container-lowest border border-stroke-subtle rounded-xl p-6 h-full flex flex-col items-center justify-center gap-4 transition-all hover:bg-surface-container-low">
<div class="icon-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-4xl" data-icon="podcasts" style="font-variation-settings: 'FILL' 0;">podcasts</span>
</div>
<span class="font-label-bold text-label-bold text-on-background">Livestream</span>
</div>
</label>
<label class="option-card cursor-pointer">
<input class="sr-only" name="gig_type" type="radio" value="event"/>
<div class="bg-surface-container-lowest border border-stroke-subtle rounded-xl p-6 h-full flex flex-col items-center justify-center gap-4 transition-all hover:bg-surface-container-low">
<div class="icon-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-4xl" data-icon="event" style="font-variation-settings: 'FILL' 0;">event</span>
</div>
<span class="font-label-bold text-label-bold text-on-background">Event</span>
</div>
</label>
<label class="option-card cursor-pointer">
<input class="sr-only" name="gig_type" type="radio" value="other"/>
<div class="bg-surface-container-lowest border border-stroke-subtle rounded-xl p-6 h-full flex flex-col items-center justify-center gap-4 transition-all hover:bg-surface-container-low">
<div class="icon-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-4xl" data-icon="dashboard_customize" style="font-variation-settings: 'FILL' 0;">dashboard_customize</span>
</div>
<span class="font-label-bold text-label-bold text-on-background">Other</span>
</div>
</label>
</div>
</section>
<!-- Step 2 -->
<section>
<div class="flex items-center gap-3 mb-6 border-b border-stroke-subtle pb-4">
<div class="w-8 h-8 rounded-full bg-on-background text-on-primary flex items-center justify-center font-label-bold">2</div>
<h2 class="font-headline-md text-headline-md-mobile md:text-headline-md text-on-background">What kind of gig?</h2>
</div>
<div class="flex flex-wrap gap-4">
<label class="cursor-pointer">
<input class="peer sr-only" name="gig_category" type="radio" value="wedding"/>
<div class="px-6 py-3 rounded-full border border-stroke-subtle bg-surface-container-lowest text-on-background font-label-bold text-label-bold transition-colors hover:bg-surface-container-low peer-checked:bg-primary-container peer-checked:text-on-primary peer-checked:border-primary-container">
                                Wedding
                            </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="gig_category" type="radio" value="concert"/>
<div class="px-6 py-3 rounded-full border border-stroke-subtle bg-surface-container-lowest text-on-background font-label-bold text-label-bold transition-colors hover:bg-surface-container-low peer-checked:bg-primary-container peer-checked:text-on-primary peer-checked:border-primary-container">
                                Concert
                            </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="gig_category" type="radio" value="podcast"/>
<div class="px-6 py-3 rounded-full border border-stroke-subtle bg-surface-container-lowest text-on-background font-label-bold text-label-bold transition-colors hover:bg-surface-container-low peer-checked:bg-primary-container peer-checked:text-on-primary peer-checked:border-primary-container">
                                Podcast
                            </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="gig_category" type="radio" value="corporate"/>
<div class="px-6 py-3 rounded-full border border-stroke-subtle bg-surface-container-lowest text-on-background font-label-bold text-label-bold transition-colors hover:bg-surface-container-low peer-checked:bg-primary-container peer-checked:text-on-primary peer-checked:border-primary-container">
                                Corporate
                            </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="gig_category" type="radio" value="church"/>
<div class="px-6 py-3 rounded-full border border-stroke-subtle bg-surface-container-lowest text-on-background font-label-bold text-label-bold transition-colors hover:bg-surface-container-low peer-checked:bg-primary-container peer-checked:text-on-primary peer-checked:border-primary-container">
                                Church
                            </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="gig_category" type="radio" value="custom"/>
<div class="px-6 py-3 rounded-full border border-stroke-subtle bg-surface-container-lowest text-on-background font-label-bold text-label-bold transition-colors hover:bg-surface-container-low peer-checked:bg-primary-container peer-checked:text-on-primary peer-checked:border-primary-container">
                                Custom
                            </div>
</label>
</div>
</section>
<!-- Step 3 -->
<section>
<div class="flex items-center gap-3 mb-6 border-b border-stroke-subtle pb-4">
<div class="w-8 h-8 rounded-full bg-on-background text-on-primary flex items-center justify-center font-label-bold">3</div>
<h2 class="font-headline-md text-headline-md-mobile md:text-headline-md text-on-background">How big?</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-gutter">
<label class="cursor-pointer">
<input class="peer sr-only" name="gig_size" type="radio" value="small"/>
<div class="bg-surface-container-lowest border border-stroke-subtle rounded-xl p-6 text-center transition-all hover:bg-surface-container-low peer-checked:border-primary peer-checked:bg-surface-container-low">
<span class="font-label-bold text-label-bold text-on-background block mb-2">Small</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Solo / Minimal setup</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="gig_size" type="radio" value="medium"/>
<div class="bg-surface-container-lowest border border-stroke-subtle rounded-xl p-6 text-center transition-all hover:bg-surface-container-low peer-checked:border-primary peer-checked:bg-surface-container-low">
<span class="font-label-bold text-label-bold text-on-background block mb-2">Medium</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Small crew / Multi-cam</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="gig_size" type="radio" value="large"/>
<div class="bg-surface-container-lowest border border-stroke-subtle rounded-xl p-6 text-center transition-all hover:bg-surface-container-low peer-checked:border-primary peer-checked:bg-surface-container-low">
<span class="font-label-bold text-label-bold text-on-background block mb-2">Large</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Full production</span>
</div>
</label>
</div>
</section>
<!-- Actions -->
<div class="pt-section-gap flex flex-col md:flex-row gap-gutter justify-end items-center border-t border-stroke-subtle">
<button class="w-full md:w-auto px-8 py-4 rounded-lg bg-transparent border border-on-background text-on-background font-label-bold text-label-bold transition-colors hover:bg-surface-container-low" type="button">
                        Build it yourself
                    </button>
<button class="w-full md:w-auto px-8 py-4 rounded-lg bg-primary-container text-on-primary font-label-bold text-label-bold shadow-sm transition-opacity hover:opacity-90 flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
                        Get AI suggestions
                    </button>
</div>
</form>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-16 bg-surface-container-lowest border-t border-stroke-subtle transition-transform md:hidden">
<div class="flex flex-col items-center justify-center text-primary font-label-bold hover:text-primary active:scale-95 transition-transform w-full h-full cursor-pointer">
<span class="material-symbols-outlined" data-icon="event_note">event_note</span>
<span class="font-label-bold text-label-caps mt-1">Gigs</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant font-label-bold hover:text-primary active:scale-95 transition-transform w-full h-full cursor-pointer">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="font-label-bold text-label-caps mt-1">Inventory</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant font-label-bold hover:text-primary active:scale-95 transition-transform w-full h-full cursor-pointer">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-bold text-label-caps mt-1">Settings</span>
</div>
</nav>
</body></html>
