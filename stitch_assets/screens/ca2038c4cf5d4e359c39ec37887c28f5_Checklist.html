<script>
        // Simple script to toggle line-through on click for visual feedback
        document.querySelectorAll('.pack-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const label = e.target.closest('label');
                const textSpan = label.querySelector('span:not(.material-symbols-outlined)');
                const warningIcon = label.querySelector('span[title="Missing Item"]');
                
                if (e.target.checked) {
                    textSpan.classList.add('line-through', 'opacity-70', 'font-body-md');
                    textSpan.classList.remove('font-label-bold');
                    label.classList.remove('border-primary-container');
                    label.classList.add('border-stroke-subtle');
                    if(warningIcon) warningIcon.style.display = 'none';
                    const indicator = label.querySelector('.absolute');
                    if(indicator) indicator.style.display = 'none';
                } else {
                    textSpan.classList.remove('line-through', 'opacity-70', 'font-body-md');
                    textSpan.classList.add('font-label-bold');
                    label.classList.add('border-primary-container');
                    label.classList.remove('border-stroke-subtle');
                    if(warningIcon) warningIcon.style.display = 'block';
                    const indicator = label.querySelector('.absolute');
                    if(indicator) indicator.style.display = 'block';
                }
            });
        });
    </script>
